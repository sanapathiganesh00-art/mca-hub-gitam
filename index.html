<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCA-HUB • Notes and PYQs for MCA students</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--surface:#fff;--text:#0f1730;--muted:#5a6685;--accent:#5b5bf0;--accent2:#0fb5a3;--accent3:#e0489b;--border:#d8dff0;--code:#0d1426;--shadow:0 24px 60px rgba(40,50,120,.16);--head:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#050814;--surface:#0d1530;--text:#eaf0ff;--muted:#93a1c9;--accent:#8b8bff;--accent2:#2de0cd;--accent3:#ff6ec4;--border:#1f2a4d;--shadow:0 24px 60px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px;height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
#cg{position:fixed;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%);left:-999px;top:-999px;transition:opacity .3s}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 5vw;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.logo{font:700 1.3rem var(--head);letter-spacing:.5px}.logo b{color:var(--accent)}
.nr{display:flex;align-items:center;gap:18px}
nav a{color:var(--muted);text-decoration:none;font-size:.92rem}nav a:hover{color:var(--text)}
.tg{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:1rem}
.hero{position:relative;min-height:94vh;display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding:50px 5vw;overflow:hidden;perspective:1200px}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:56px 56px;opacity:.35;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);animation:gp 14s linear infinite}
@keyframes gp{to{background-position:56px 56px}}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38;animation:dr 16s ease-in-out infinite alternate}
.o1{width:420px;height:420px;background:var(--accent);top:-120px;left:-100px}
.o2{width:380px;height:380px;background:var(--accent2);bottom:-140px;right:10%;animation-delay:-5s}
.o3{width:300px;height:300px;background:var(--accent3);top:30%;right:-100px;animation-delay:-9s;opacity:.28}
@keyframes dr{to{transform:translate(70px,50px) scale(1.2)}}
#bg,#net{position:absolute;inset:0;width:100%;height:100%}
#bg{opacity:.75}
.hl{position:relative;z-index:2}
.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border:1px solid var(--border);border-radius:99px;color:var(--muted);font:.8rem var(--mono);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);animation:pu 1.6s infinite}
@keyframes pu{50%{transform:scale(1.7);opacity:.5}}
h1{font:700 clamp(3.2rem,10vw,7rem)/1 var(--head);margin:18px 0 12px;letter-spacing:-2px}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3),var(--accent));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite;display:inline-block}
@keyframes sh{to{background-position:300% 0}}
.ty{font:600 1.25rem var(--mono);color:var(--accent2);min-height:1.8em;margin-bottom:6px}
.ty:before{content:"> ";color:var(--muted)}
.ty i{display:inline-block;width:9px;height:1.1em;background:var(--accent2);vertical-align:-3px;margin-left:3px;animation:bl 1s steps(1) infinite}
.hl p{color:var(--muted);font-size:1.1rem;max-width:520px;margin:0 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;display:inline-block;padding:14px 26px;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:700;text-decoration:none;box-shadow:var(--shadow);transition:transform .2s;border:0;cursor:pointer;font-size:1rem}
.btn:after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sw 3.5s infinite}
@keyframes sw{60%,100%{left:140%}}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--border);box-shadow:none}.btn.ghost:after{display:none}
.stats{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}
.stats div{font:700 2rem var(--head)}.stats span{display:block;font:400 .78rem var(--mono);color:var(--muted)}
.hr{position:relative;z-index:2;display:grid;place-items:center;min-height:380px}
.term{width:min(450px,100%);background:var(--code);border:1px solid #2a3560;border-radius:16px;box-shadow:0 40px 80px rgba(0,0,0,.45),0 0 70px rgba(91,91,240,.3);transform-style:preserve-3d;transition:transform .12s ease-out;color:#cfe0ff;animation:fl 7s ease-in-out infinite}
.tb{display:flex;gap:7px;padding:12px 14px;border-bottom:1px solid #1d2748;align-items:center}
.tb i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.tb i:nth-child(2){background:#febc2e}.tb i:nth-child(3){background:#28c840}
.tb span{margin-left:auto;font:.72rem var(--mono);color:#6f7fae}
pre{margin:0;padding:18px;font:.84rem/1.65 var(--mono);min-height:250px;white-space:pre-wrap;transform:translateZ(30px)}
.k{color:#c792ea}.s{color:#c3e88d}.f{color:#82aaff}.c{color:#637099}
.cur{display:inline-block;width:8px;height:1em;background:var(--accent2);vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.chip{position:absolute;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font:600 .8rem var(--mono);box-shadow:var(--shadow);animation:fl 5s ease-in-out infinite;z-index:3}
.c1{top:2%;right:0}.c2{bottom:4%;left:-2%;animation-delay:-2s}.c3{top:46%;right:-3%;animation-delay:-3.5s}.c4{top:12%;left:-3%;animation-delay:-1s}
@keyframes fl{50%{transform:translateY(-16px)}}
.mq{overflow:hidden;border-block:1px solid var(--border);background:color-mix(in srgb,var(--surface) 60%,transparent);padding:14px 0;position:relative;z-index:2}
.mt{display:flex;gap:46px;width:max-content;animation:mqa 36s linear infinite;font:600 .95rem var(--mono);color:var(--muted)}
.mt span{white-space:nowrap}.mt b{color:var(--accent);margin-right:8px}
@keyframes mqa{to{transform:translateX(-50%)}}
section{padding:70px 5vw;max-width:1200px;margin:0 auto;position:relative;z-index:2}
h2{font:700 2.2rem var(--head);margin:0 0 6px}.sub{color:var(--muted);margin:0 0 34px}
.rv{opacity:0;transform:translateY(34px) scale(.97);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;perspective:1100px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease-out,border-color .2s,opacity .7s;transform-style:preserve-3d;text-align:left;color:var(--text);font:inherit;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--accent) 24%,transparent),transparent 55%);opacity:0;transition:opacity .2s}
.card:hover::after{opacity:1}
.card:hover,.card.on{border-color:var(--accent)}
.card.on{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent),var(--shadow)}
.ico{display:grid;place-items:center;width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:700 1.25rem var(--mono);transform:translateZ(45px);margin-bottom:14px;animation:ic 4s ease-in-out infinite}
@keyframes ic{50%{transform:translateZ(45px) rotate(-6deg) scale(1.08)}}
.card h3{margin:0 0 6px;font:700 1.15rem var(--head);transform:translateZ(28px)}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.cnt{margin-top:14px;font:.76rem var(--mono);color:var(--accent);transform:translateZ(20px)}
.panel{margin-top:42px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:var(--shadow);scroll-margin-top:90px;animation:pin .5s ease}
@keyframes pin{from{opacity:0;transform:translateY(24px)}}
.tabs{display:flex;gap:8px;margin:16px 0 22px;background:var(--bg);padding:6px;border-radius:14px;width:fit-content;max-width:100%}
.tab{border:0;background:none;color:var(--muted);padding:10px 24px;border-radius:10px;font:700 .95rem var(--head);cursor:pointer;transition:background .25s,color .25s}
.tab.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.gh{font:.78rem var(--mono);color:var(--muted);margin:22px 0 10px;text-transform:uppercase;letter-spacing:1px}
.list{display:grid;gap:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--border);border-radius:14px;transition:transform .2s,border-color .2s;background:var(--bg);animation:si .5s both}
@keyframes si{from{opacity:0;transform:translateX(-24px)}}
.item:hover{transform:translateX(6px);border-color:var(--accent)}
.it b{display:block}.it small{color:var(--muted);font:.76rem var(--mono)}
.ia{display:flex;gap:8px;flex-shrink:0}
.ia button,.ia a{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:10px;font:600 .85rem inherit;cursor:pointer;text-decoration:none}
.ia button{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0}
.empty{padding:30px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);text-align:center}
#vw{position:fixed;inset:0;z-index:70;background:rgba(3,6,14,.78);backdrop-filter:blur(6px);display:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 14px}
#vw.on{display:flex;flex-direction:column}
.vb{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;margin-bottom:10px;font-weight:700}
.vb button{border:0;background:#fff;color:#111;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer}
#vf{flex:1;width:100%;border:0;border-radius:14px;background:#fff}
footer{text-align:center;color:var(--muted);padding:40px 5vw;border-top:1px solid var(--border);font:.85rem var(--mono);position:relative;z-index:2}
@media (max-width:860px){.hero{grid-template-columns:1fr;min-height:auto}.hr{min-height:320px}.item{flex-direction:column;align-items:flex-start}#cg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto}.rv{opacity:1;transform:none}}

/* ---- click effects and extra animation ---- */
#sbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:80;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));box-shadow:0 0 12px var(--accent2)}
.hl>*,.hr{opacity:0}
body.ready .hl>*{animation:hin .9s cubic-bezier(.2,.8,.2,1) both}
body.ready .hl>*:nth-child(1){animation-delay:.05s}body.ready .hl>*:nth-child(2){animation-delay:.18s}body.ready .hl>*:nth-child(3){animation-delay:.32s}body.ready .hl>*:nth-child(4){animation-delay:.44s}body.ready .hl>*:nth-child(5){animation-delay:.56s}
body.ready .hr{animation:hrin 1.3s .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes hrin{from{opacity:0;transform:translateX(90px) rotateY(-30deg) scale(.9)}to{opacity:1;transform:none}}
body.intro-on{overflow:hidden}
@keyframes hin{from{opacity:0;transform:translateY(40px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.rp{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.5);transform:scale(0);animation:rpa .65s ease-out forwards}
@keyframes rpa{to{transform:scale(1);opacity:0}}
.ia a .rp,.card .rp,.tab .rp{background:color-mix(in srgb,var(--accent) 38%,transparent)}
.pt{position:fixed;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;pointer-events:none;z-index:90}
.ia button,.ia a{position:relative;overflow:hidden;min-width:122px;text-align:center;transition:transform .15s,box-shadow .2s,background .3s,color .3s}
.ia button:hover,.ia a:hover{transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.ia button:active,.ia a:active{transform:scale(.93)}
.vbt.busy{animation:bz .5s ease}
.vbt.busy .bl:before{content:"";display:inline-block;width:12px;height:12px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-right:6px;vertical-align:-2px;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bz{50%{transform:scale(1.08);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 25%,transparent)}}
.pr{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.ia a.dl{border-color:var(--accent)}.ia a.dl .pr{width:100%;transition:width 1.5s linear}
.ia a.ok{background:#16a34a;color:#fff;border-color:#16a34a;animation:pop .45s}
@keyframes pop{50%{transform:scale(1.14)}}
.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--accent),var(--accent2));transform:scaleY(0);transition:transform .25s}
.item{position:relative;overflow:hidden}.item:hover:before{transform:scaleY(1)}
.tabs{position:relative}.tab{position:relative;z-index:1;overflow:hidden}
.tab.on{background:none;color:#fff}
.tp{position:absolute;top:6px;bottom:6px;left:6px;width:80px;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:left .4s cubic-bezier(.2,.8,.2,1),width .4s cubic-bezier(.2,.8,.2,1);z-index:0;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
#tw{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:95;display:grid;gap:10px;justify-items:center;width:max-content;max-width:92vw;pointer-events:none}
.ts{position:relative;overflow:hidden;display:flex;gap:10px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--surface);color:var(--text);border:1px solid var(--accent);box-shadow:var(--shadow),0 0 30px color-mix(in srgb,var(--accent) 30%,transparent);animation:tin .45s cubic-bezier(.2,.9,.3,1.3)}
.ts.out{animation:tout .4s forwards}.ti{font-size:1.2rem}
.tbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left;animation:tb 2.6s linear forwards}
@keyframes tb{to{transform:scaleX(0)}}
@keyframes tin{from{opacity:0;transform:translateY(40px) scale(.8)}}
@keyframes tout{to{opacity:0;transform:translateY(20px) scale(.9)}}
#vw.on{animation:vin .55s cubic-bezier(.2,.8,.2,1)}
#vw.out{animation:vout .3s forwards}
@keyframes vin{from{opacity:.4;clip-path:circle(0 at var(--ox,50%) var(--oy,50%))}to{opacity:1;clip-path:circle(150% at var(--ox,50%) var(--oy,50%))}}
@keyframes vout{to{opacity:0;transform:scale(.96)}}
#vl{height:3px;border-radius:3px;margin-bottom:8px;opacity:0;background:linear-gradient(90deg,transparent,var(--accent2),var(--accent3),transparent);background-size:50% 100%;background-repeat:no-repeat;transition:opacity .3s}
#vl.go{opacity:1;animation:ld 1s linear infinite}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
#vf{opacity:0;transform:scale(.97);transition:opacity .5s,transform .5s}#vf.rdy{opacity:1;transform:none}
.card .rp{z-index:3}

/* ---- intro ---- */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at center,#0b1233 0%,#02040c 72%);color:#fff;overflow:hidden;transition:opacity .7s ease,visibility .7s}
#intro.gone{opacity:0;visibility:hidden}
#ic{position:absolute;inset:0;width:100%;height:100%}
.iw{position:absolute;inset:0;display:grid;place-content:center;text-align:center;perspective:900px;pointer-events:none;padding:0 4vw}
.i1{font:600 clamp(.8rem,2.4vw,1.2rem) var(--mono);letter-spacing:.6em;color:#8fa2d8;opacity:0;animation:i1 1s 1s forwards}
@keyframes i1{from{opacity:0;letter-spacing:1.4em;filter:blur(8px)}to{opacity:1;letter-spacing:.6em;filter:none}}
.i2{display:flex;justify-content:center;margin:10px 0;transform-style:preserve-3d}
.i2 span{display:inline-block;font:700 clamp(3.2rem,15vw,10rem)/1 var(--head);opacity:0;transform:translateZ(-900px) rotateX(-110deg);animation:il .95s cubic-bezier(.2,.9,.2,1.1) forwards;background:linear-gradient(180deg,#fff,#8bd9ff 55%,#8b8bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(120,140,255,.75))}
@keyframes il{60%{opacity:1}to{opacity:1;transform:none}}
.i3{font:.78rem var(--mono);color:#6f7fae;height:1.4em;margin-top:6px;letter-spacing:.3em}
.ibar{width:min(320px,70vw);height:3px;background:#1a2447;border-radius:3px;margin:16px auto 0;overflow:hidden}
.ibar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b8bff,#2de0cd,#ff6ec4);animation:ib 4s cubic-bezier(.3,.1,.2,1) .2s forwards}
@keyframes ib{to{width:100%}}
#skip{position:absolute;right:20px;top:calc(env(safe-area-inset-top,0px) + 18px);z-index:3;background:rgba(255,255,255,.08);color:#cfe0ff;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 18px;font:600 .85rem var(--mono);cursor:pointer;backdrop-filter:blur(6px)}
#flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#bfe3ff 40%,transparent 70%);opacity:0;pointer-events:none}
#flash.go{animation:fl2 .9s ease-out forwards}
@keyframes fl2{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(3)}}
#cr{position:fixed;left:-18px;top:-18px;width:36px;height:36px;border:2px solid var(--accent2);border-radius:50%;pointer-events:none;z-index:150;opacity:.85;transition:width .25s,height .25s,margin .25s,background .25s,border-color .25s}
#cr.hv{width:62px;height:62px;margin:-13px 0 0 -13px;background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent)}
@media (pointer:coarse){#cr{display:none}}
@media (prefers-reduced-motion:reduce){.hl>*,.hr{opacity:1!important}}

/* ---- exam dashboard ---- */
.exg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-bottom:24px;perspective:1100px}
.ex{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;cursor:pointer;text-align:left;color:var(--text);font:inherit;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s ease-out,border-color .2s,box-shadow .3s,opacity .7s;transform-style:preserve-3d}
.ex:before{content:"";position:absolute;left:0;top:0;height:4px;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));transform:scaleX(0);transform-origin:left;transition:transform .5s}
.ex.on:before{transform:scaleX(1)}
.ex.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent),var(--shadow)}
.ex:hover{border-color:var(--accent)}
.eb{display:inline-block;font:700 .8rem var(--mono);padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);transform:translateZ(30px)}
.ex h3{font:700 1.45rem var(--head);margin:12px 0 4px;transform:translateZ(26px)}
.em{color:var(--muted);font:.8rem var(--mono)}
.en{display:flex;gap:24px;margin-top:16px;transform:translateZ(18px)}.en div{font:700 1.8rem var(--head)}.en span{display:block;font:400 .72rem var(--mono);color:var(--muted)}
.mx{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:6px}

{n:"mca_hub.c",l:"c",c:'// pointers and structs\n#include <stdio.h>\n\nstruct Node { int data; struct Node *next; };\n\nint main() {\n  struct Node n = {42, NULL};\n  printf("%d\\n", n.data);\n  return 0;\n}'},
{n:"model.py",l:"py",c:'# a tiny neural network layer\nimport numpy as np\n\nclass Layer:\n    def __init__(self, n_in, n_out):\n        self.w = np.random.randn(n_in, n_out)\n\n    def forward(self, x):\n        return np.tanh(x @ self.w)'},
{n:"shape.cpp",l:"c",c:'// polymorphism in C++\nclass Shape {\n public:\n  virtual double area() = 0;\n};\n\nclass Circle : public Shape {\n  double r;\n public:\n  double area() override {\n    return 3.14159 * r * r;\n  }\n};'}];
function hl(code,lang){
 var e=code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 var com=lang==="py"?"#.*":"\\/\\/.*",kw="int|struct|class|public|return|import|def|self|virtual|override|double|void|NULL|from|as|if|for";
 var re=new RegExp("("+com+")|(#include)|(&lt;[a-z.]+&gt;|\"[^\"\\n]*\")|\\b("+kw+")\\b|\\b(printf|main|forward|area|randn|tanh)\\b","g");
 return e.replace(re,function(m,a,b,c,d,f){if(a)return '<span class="c">'+a+'</span>';if(b)return '<span class="k">'+b+'</span>';if(c)return '<span class="s">'+c+'</span>';if(d)return '<span class="k">'+d+'</span>';return '<span class="f">'+f+'</span>'});
}
(function(){
 var el=$("code"),si=0,html=hl(SN[0].c,SN[0].l),pos=0,total;
 function cnt(h){var n=0,t=false;for(var q=0;q<h.length;q++){var c=h[q];if(c==="<")t=true;else if(c===">")t=false;else if(!t)n++}return n}
 total=cnt(html);
 function step(){
  var o="",inTag=false,shown=0;
  for(var k=0;k<html.length&&shown<pos;k++){var ch=html[k];o+=ch;if(ch==="<")inTag=true;else if(ch===">")inTag=false;else if(!inTag)shown++}
  el.innerHTML=o+'<span class="cur"></span>';pos++;
  if(pos>total+30){pos=0;si=(si+1)%SN.length;html=hl(SN[si].c,SN[si].l);total=cnt(html);$("fn").textContent=SN[si].n}
  setTimeout(step,pos>total?60:32);
 }
 step();
})();

/* ---------- AI/ML neural network + floating code background ---------- */
(function(){
 var cv=$("bg"),x=cv.getContext("2d"),W,H,layers=[4,7,7,3],nodes=[],edges=[],sig=[],toks=[],col={a:"#8b8bff",b:"#2de0cd"},fr=0;
 function colors(){var cs=getComputedStyle(document.documentElement);col.a=cs.getPropertyValue("--accent").trim()||col.a;col.b=cs.getPropertyValue("--accent2").trim()||col.b}
 window.__col=colors;colors();
 function build(){
  W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight;nodes=[];edges=[];sig=[];
  layers.forEach(function(n,l){for(var i=0;i<n;i++)nodes.push({l:l,x:W*(.06+.88*l/(layers.length-1)),y:H*(.16+.68*(i+.5)/n),p:Math.random()*6})});
  nodes.forEach(function(a,i){nodes.forEach(function(b,j){if(b.l===a.l+1)edges.push([i,j])})});
  var T=["{ }","</>","=>","λ","∑","σ","0","1","if","for","::","*p","AI","ML","->","git","fn()","≈","∂"];toks=[];
  for(var k=0;k<34;k++)toks.push({t:T[k%T.length],x:Math.random()*W,y:Math.random()*H,v:.15+Math.random()*.45,s:12+Math.random()*18,a:.15+Math.random()*.3,w:Math.random()*6})
 }
 build();addEventListener("resize",build);
 var still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 function draw(){
  requestAnimationFrame(draw);if(document.body.classList.contains("lock"))return;fr++;x.clearRect(0,0,W,H);
  x.textAlign="center";
  toks.forEach(function(t){if(!still){t.y-=t.v;t.x+=Math.sin(fr*.01+t.w)*.25;if(t.y<-20){t.y=H+20;t.x=Math.random()*W}}
   x.globalAlpha=t.a;x.fillStyle=col.b;x.font=t.s+"px 'JetBrains Mono',monospace";x.fillText(t.t,t.x,t.y)});
  x.globalAlpha=.16;x.strokeStyle=col.a;x.lineWidth=1;
  edges.forEach(function(e){var a=nodes[e[0]],b=nodes[e[1]];x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()});
  if(!still&&fr%14===0)sig.push({e:edges[Math.floor(Math.random()*edges.length)],t:0});
  sig=sig.filter(function(s){s.t+=.014;var a=nodes[s.e[0]],b=nodes[s.e[1]],px=a.x+(b.x-a.x)*s.t,py=a.y+(b.y-a.y)*s.t;
   x.globalAlpha=.9;x.fillStyle=col.b;x.shadowColor=col.b;x.shadowBlur=14;x.beginPath();x.arc(px,py,3.2,0,6.3);x.fill();x.shadowBlur=0;
   if(s.t>=1)nodes[s.e[1]].p=0;return s.t<1});
  nodes.forEach(function(n){var pulse=still?1:1+.25*Math.sin(fr*.04+n.p);x.globalAlpha=.85;x.fillStyle=col.a;x.shadowColor=col.a;x.shadowBlur=12;x.beginPath();x.arc(n.x,n.y,5*pulse,0,6.3);x.fill();x.shadowBlur=0;x.globalAlpha=.5;x.strokeStyle=col.b;x.beginPath();x.arc(n.x,n.y,9*pulse,0,6.3);x.stroke()});
  x.globalAlpha=1;
 }
 draw();
})();

/* ---------- 3D graph scene ---------- */
try{
 var cv3=$("net"),hero=$("hero");
 var R=new THREE.WebGLRenderer({canvas:cv3,alpha:true,antialias:true});
 R.setPixelRatio(Math.min(devicePixelRatio,2));
 var S=new THREE.Scene(),C=new THREE.PerspectiveCamera(55,1,.1,100);C.position.z=11;
 var G=new THREE.Group();S.add(G);
 var N=60,P=[],i,j;
 for(i=0;i<N;i++){var u=Math.random()*2-1,a=Math.random()*Math.PI*2,r=4.5+Math.random()*3,s=Math.sqrt(1-u*u);P.push(new THREE.Vector3(r*s*Math.cos(a),r*u*.8,r*s*Math.sin(a)-3))}
 G.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(P),new THREE.PointsMaterial({color:0xff6ec4,size:.12,transparent:true,opacity:.9})));
 var seg=[];for(i=0;i<N;i++)for(j=i+1;j<N;j++)if(P[i].distanceTo(P[j])<2.7){seg.push(P[i],P[j])}
 G.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(seg),new THREE.LineBasicMaterial({color:0x8b8bff,transparent:true,opacity:.22})));
 function wire(g,c,x,y,z){var m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:.55}));m.position.set(x,y,z);G.add(m);return m}
 var m1=wire(new THREE.TorusKnotGeometry(.9,.26,90,12),0xff7ad9,-5.6,2.4,-1);
 var m2=wire(new THREE.OctahedronGeometry(1),0xffc34d,5.8,-2.6,-1);
 var m3=wire(new THREE.IcosahedronGeometry(1.2,1),0x2de0cd,-4.8,-3,0);
 var m4=wire(new THREE.BoxGeometry(1.4,1.4,1.4),0x6b6bff,5.2,2.8,-2);
 var mx=0,my=0;
 hero.addEventListener("pointermove",function(e){var r=hero.getBoundingClientRect();mx=(e.clientX-r.left)/r.width-.5;my=(e.clientY-r.top)/r.height-.5;
  $("term").style.transform="rotateY("+(mx*24)+"deg) rotateX("+(-my*20)+"deg)"});
 hero.addEventListener("pointerleave",function(){$("term").style.transform=""});
 function size(){var w=hero.clientWidth,h=hero.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}
 size();addEventListener("resize",size);
 var still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 (function loop(t){requestAnimationFrame(loop);
  if(!still){G.rotation.y=t*.00009+mx*.6;m1.rotation.x=t*.0006;m1.rotation.y=t*.0004;m2.rotation.y=t*.0008;m2.rotation.z=t*.0005;m3.rotation.x=t*.0004;m3.rotation.y=t*.0007;m4.rotation.x=t*.0007;m4.rotation.z=t*.0005}
  G.rotation.x+=(my*.4-G.rotation.x)*.05;
  if(!document.body.classList.contains("lock"))R.render(S,C)})(0);
}catch(e){console.warn("3D unavailable",e)}
